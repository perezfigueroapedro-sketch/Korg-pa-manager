name: Build Korg APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK
        run: |
          mkdir -p ~/.android/licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051b8f" > ~/.android/licenses/android-sdk-preview-license
          cp ~/.android/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          # Primer intento para que descargue el SDK
          buildozer android debug || true
          # Ahora si aceptamos la 37 donde Buildozer lo descargó
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager -type f | head -n 1)
          echo "Encontrado: $SDKMANAGER"
          yes | $SDKMANAGER --licenses || true
          cp ~/.android/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          yes | $SDKMANAGER "build-tools;37.0.0" || true
          # Segundo intento ya con licencia
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Korg-Pa-Manager-APK
          path: bin/*.apk
