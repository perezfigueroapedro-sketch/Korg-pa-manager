
name: Build Korg APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip openjdk-17-jdk zip unzip libffi-dev libssl-dev libbz2-dev libsqlite3-dev libncurses5-dev libncursesw5-dev libreadline-dev liblzma-dev autoconf automake libtool pkg-config zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Korg-Pa-Manager-APK
          path: bin/*.apk
