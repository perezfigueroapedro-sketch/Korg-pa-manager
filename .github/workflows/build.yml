name: Build Korg APK
on: push
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install Cython==0.29.33 buildozer
      - name: Build
        run: |
          rm -rf .buildozer bin
          buildozer android debug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
